version: '3.8'

services:
  backend-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shopping_backend_api
    ports:
      - "5050:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=postgres-db;Port=5432;Database=shopping_dotnet_db;Username=ekremberatrecep;Password=mysecretpassword
      - JwtSettings__Secret=secret_key_that_is_at_least_32_bytes_long!
      - S3__ServiceUrl=http://minio-s3:9000
      - S3__AccessKey=minioadmin
      - S3__SecretKey=minioadmin
      - S3__BucketName=myshoppingapp
      - S3__PublicUrlPrefix=http://localhost:9000/myshoppingapp/
    depends_on:
      - postgres-db
      - seq-logger
      - minio-s3
    networks:
      - shopping_network

  postgres-db:
    image: postgres:15-alpine
    container_name: shopping_postgres
    environment:
      - POSTGRES_USER=ekremberatrecep
      - POSTGRES_PASSWORD=mysecretpassword
      - POSTGRES_DB=shopping_dotnet_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - shopping_network

  seq-logger:
    image: datalust/seq:latest
    container_name: shopping_seq
    environment:
      - ACCEPT_EULA=Y
    ports:
      - "5341:80"
    networks:
      - shopping_network

  minio-s3:
    image: minio/minio
    container_name: shopping_minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - shopping_network

volumes:
  postgres_data:
  minio_data:

networks:
  shopping_network:
    driver: bridge
