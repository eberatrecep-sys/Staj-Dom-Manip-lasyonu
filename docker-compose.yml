version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: shoppingdb
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    # Portları DIŞARI AÇMIYORUZ (Sadece docker ağı içinden erişilebilir)

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@ebrsoft.com.tr
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db
    restart: unless-stopped


  redis:
    image: redis:alpine
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio_data:/data
    restart: unless-stopped
    
  minio-setup:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb myminio/myshoppingapp || true;
      /usr/bin/mc anonymous set public myminio/myshoppingapp;
      exit 0;
      "

  backend:
    build:
      context: ./MyShoppingApp
      dockerfile: Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=db;Database=shoppingdb;Username=admin;Password=mysecretpassword
      - ConnectionStrings__Redis=redis:6379
    depends_on:
      - db
      - redis
    restart: unless-stopped
    # PORT AÇMIYORUZ! Sadece Nginx buraya erişecek.

  customer-app:
    build:
      context: ./front-end-monorepo/packages/customer-app
      dockerfile: Dockerfile
    restart: unless-stopped

  admin-panel:
    build:
      context: ./front-end-monorepo/packages/admin-panel
      dockerfile: Dockerfile
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./MyShoppingApp/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - customer-app
      - admin-panel
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  minio_data:
